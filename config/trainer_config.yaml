# Same hyperparameters as Arcade-Prototype/ML-Agents/Config/trainer_config.yaml (only the behavior name differs),
# so results of both games stay comparable and the networks have the same shape.
behaviors:
  AgentSimulationBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 0.025
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 100000
    keep_checkpoints: 100
